services:
  polydocks:
    build:
      context: .
      dockerfile: Dockerfile
    image: polydocks:latest
    container_name: polydocks-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - AGENT_HOME_DIR=/app/agent-home
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - agent-home-data:/app/agent-home
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
          pids: 100
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3000/api/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  agent-home-data:

