services:
  polymax:
    build:
      context: .
      dockerfile: Dockerfile
    image: polymax:latest
    container_name: polymax-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://localhost:3000/api/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
