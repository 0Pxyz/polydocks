<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World Plugin</title>
  <style>
    body {
      margin: 0;
      padding: 1.5rem;
      font-family: var(--font-sans, system-ui, sans-serif);
      background-color: var(--color-bg, #090a0f);
      color: var(--color-text, #f0f3f6);
    }
    .card {
      border: 1px solid var(--color-border, #1f2430);
      border-radius: 8px;
      padding: 1.25rem;
      background: rgba(255, 255, 255, 0.02);
    }
    h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.125rem;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.875rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Hello from Polymax Plugin!</h2>
    <p>This is a sandboxed surface rendered inside an iframe, communicating via window.polymax bridge.</p>
  </div>
</body>
</html>
