name: main-check

# Release-gate CI: runs ONLY for main. PRs targeting dev are unaffected.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile --no-progress
      - run: bun run check
  browser-smoke:
    # Non-blocking by design: the script stays as the manual pre-demo /
    # pre-release validation path, but a pointer-timing flake must never
    # hold up development or merges. `check` is the required gate.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile --no-progress
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:browser
