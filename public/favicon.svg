<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .pill { fill: #171b22; stroke: rgba(255, 255, 255, 0.22); }
    .dot-dim { fill: #7d8590; }
    .dot-lime { fill: #c8ff57; }
    @media (prefers-color-scheme: light) {
      .pill { fill: #14171c; stroke: rgba(0, 0, 0, 0.35); }
      .dot-dim { fill: #9aa0a8; }
    }
  </style>
  <defs>
    <radialGradient id="favSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#222b38" />
      <stop offset="65%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>
    <linearGradient id="favHorizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8ff57" stop-opacity="0" />
      <stop offset="25%" stop-color="#c8ff57" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#c8ff57" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#c8ff57" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="favHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="favClip">
      <circle cx="12" cy="12" r="10" />
    </clipPath>
    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8ff57" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#c8ff57" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Orb: same static geometry as MiniOrb (sphere, horizon, specular) -->
  <g transform="translate(8,1) scale(2)">
    <circle cx="12" cy="12" r="10.25" stroke="rgba(200, 255, 87, 0.35)" stroke-width="0.75" />
    <circle cx="12" cy="12" r="10" fill="url(#favSphere)" />
    <g clip-path="url(#favClip)">
      <ellipse cx="12" cy="14" rx="9" ry="4.5" fill="url(#favHorizon)" opacity="0.9" />
      <path d="M 3.5 13.5 Q 12 15.5 20.5 13.5" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.9" />
    </g>
    <ellipse cx="8.5" cy="6.5" rx="3.5" ry="1.8" fill="url(#favHighlight)" transform="rotate(-25 8.5 6.5)" />
  </g>

  <!-- Dock pill with three indicators: dim, lime (new plugin), dim -->
  <rect class="pill" x="10" y="51" width="44" height="10" rx="5" stroke-width="1" />
  <circle class="dot-dim" cx="23" cy="56" r="2.4" />
  <circle fill="url(#favGlow)" cx="32" cy="56" r="5" />
  <circle class="dot-lime" cx="32" cy="56" r="2.4" />
  <circle class="dot-dim" cx="41" cy="56" r="2.4" />
</svg>
